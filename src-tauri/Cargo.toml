[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = ["protocol-asset"] }
tauri-plugin-log = "2"
# unsafe-headers: lets Ben leave out the Origin header the plugin adds by default. Browsers don't send one when
# opening a page, and some sites (DuckDuckGo among them) refuse requests that carry it.
tauri-plugin-http = { version = "2.8.0", features = ["unsafe-headers"] }
walkdir = "2.5.0"
lopdf = "0.45.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
notify = "8.2.0"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-opener = "2.7.0"

# Windows' own text recognition (OCR) for scans and photos (src/ocr.rs). Tauri already uses this crate, so it
# adds only these API features, not a new download.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams"] }
